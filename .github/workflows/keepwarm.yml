name: keep-warm
# Pings the classic app + the API every ~10 min so Render doesn't spin them down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -fsS --max-time 60 https://qntm-api.onrender.com/health || true
      - name: Ping classic app
        run: curl -fsS --max-time 90 https://app.qntm.live/ || true
