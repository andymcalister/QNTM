# render.yaml — QNTM on Render
# ============================================================================
# Blueprint deploy: in Render, New → Blueprint, point at andymcalister/qntm.
# Render reads this file and provisions the service(s).
#
# SECRETS are NOT in this file. Add them in the Render dashboard as a
# "Secret File" mounted at .streamlit/secrets.toml (paste your existing
# Streamlit Cloud secrets.toml content verbatim). That keeps st.secrets
# working with zero code changes. Be sure SUPABASE_SERVICE_KEY is included.
#
# Secret Files are PER-SERVICE: you must attach secrets.toml to BOTH the web
# service and the cron job below (Environment → Secret Files on each).
#
# CUSTOM DOMAIN: after the service is live, Settings → Custom Domains →
# add qntm.live (and www.qntm.live if you want it). Render gives you the DNS
# records to set at your registrar and auto-provisions SSL.
# ============================================================================

services:
  - type: web
    name: qntm
    runtime: python
    plan: starter            # $7/mo, always-on. Do NOT use free — it cold-starts
                             # and drops Streamlit sessions, which breaks login.
    region: virginia         # us-east — co-located with Supabase (us-east-1) to
                             # cut per-query round-trip latency from ~70ms to ~10ms.
                             # (was: oregon/us-west — cross-country from the DB.)
    branch: main             # prod tracks the main branch (same as your prod today)
    autoDeploy: true         # auto-redeploy on push to main, like Streamlit Cloud
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Intraday conviction-drop alert emails ──────────────────────────────────
  # Runs every 30 min, 13:00–21:00 UTC, Mon–Fri — a window that covers US market
  # hours year-round. intraday_alerts.py self-gates precisely to 9:30 AM–4:00 PM
  # ET (incl. DST) and no-ops when the market is closed or nobody has opted in,
  # so off-hours runs cost almost nothing. Reuses data_refresh._get_supabase,
  # which prefers SUPABASE_SERVICE_KEY (RLS-bypassing) for the batch reads.
  # REMEMBER: attach the same secrets.toml Secret File to THIS service too.
  - type: cron
    name: qntm-intraday-alerts
    runtime: python
    plan: starter            # smallest is fine — each run finishes in well under a minute
    region: virginia         # match the web service + Supabase us-east-1
    branch: main
    schedule: "*/30 13-21 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && python intraday_alerts.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── QNTM educational poster — one investing concept a day, every day ────────
  - type: cron
    name: qntm-educate
    runtime: python
    plan: starter
    region: virginia
    branch: main
    schedule: "0 17 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && python qntm_educate.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: EDUCATE_ENGINE_ENABLED
        value: "1"

  # ── QNTM content engine — grounded X posts, twice daily ─────────────────────
  - type: cron
    name: qntm-content-am
    runtime: python
    plan: starter
    region: virginia
    branch: main
    schedule: "30 15 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && python qntm_content.py --slot am
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CONTENT_ENGINE_ENABLED
        value: "1"

  - type: cron
    name: qntm-content-pm
    runtime: python
    plan: starter
    region: virginia
    branch: main
    schedule: "30 23 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && python qntm_content.py --slot pm
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CONTENT_ENGINE_ENABLED
        value: "1"

  # ── User-defined price / value-position / conviction alerts ─────────────────
  # Evaluates the price_alerts table and fans out hits to in-app + email + SMS.
  # Reads the live signal_log snapshot (price updated by the intraday cron) and
  # recomputes value_position from the current price, so the valuation-range
  # alerts track intraday. Per-alert `armed` gate prevents 30-min spam. No-ops
  # cheaply when no alerts are active. Needs the same secrets.toml Secret File,
  # plus TWILIO_* secrets for SMS (email works with the existing SENDGRID_*).
  - type: cron
    name: qntm-price-alerts
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "*/30 13-21 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && python alerts_engine.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Weekly digest email ─────────────────────────────────────────────────────
  # Saturday ~9am ET recap: SPY for the week, biggest movers on the user's lists,
  # watchlist + portfolio weekly moves (and model-vs-SPY when DIGEST_PERFORMANCE=1
  # and the performance language has cleared compliance). Uses the existing
  # SENDGRID_* config. Same secrets.toml Secret File required.
  - type: cron
    name: qntm-weekly-digest
    runtime: python
    plan: starter
    region: oregon
    branch: main
    schedule: "0 14 * * 6"
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml && python weekly_digest.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"


